  return '<div class="page"><div class="wrap">'+top('New case')+'<div class="hero"><h2>New case</h2></div><div class="panel"><div class="f"><label for="nc">Client name</label><input class="in" id="nc" autocomplete="off"></div>'+
  '<div class="grid2"><div class="f"><label for="nt">Type</label>'+sel("nt",TYPES,"Memo")+'</div><div class="f"><label for="nr">Priority</label>'+sel("nr",PR,"Medium")+'</div></div><div class="f"><label for="nd">Due date</label><input class="in" type="date" id="nd" value="'+plus(7)+'"></div>'+
  '<div class="f"><label for="na">Assigned to</label>'+staffSel("na","")+'</div><div class="f"><label for="ns">Summary</label><textarea class="in" id="ns" rows="3"></textarea></div>'+
  (S.err?'<div class="late" style="margin-bottom:12px" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn full" data-create="1"'+(S.busy?' disabled':'')+'>Create case</button></div></div></div>'}
function caseV(c){var m=isMgr();
  return '<div class="page"><div class="wrap">'+top(esc(c.id))+info()+'<div class="hero"><span class="tag '+c.pri+'">'+c.pri+' priority</span> <span class="tag">'+esc(c.type)+'</span><h2>'+esc(c.client)+'</h2><div class="sub">'+(c.summary?esc(c.summary):'No summary')+'</div></div>'+
  '<div class="panel"><label>Status</label><div class="seg" role="group" aria-label="Status">'+ST.map(function(s){return'<button class="'+(s===c.status?'on':'')+'" data-st="'+s+'">'+s+'</button>'}).join('')+'</div></div>'+
  '<div class="panel"><div class="grid2"><div class="f"><label for="fp">Priority</label>'+sel("fp",PR,c.pri,!m,"pri")+'</div><div class="f"><label for="fdv">Due</label><input class="in" type="date" id="fdv" data-fld="due" value="'+esc(c.due||"")+'"'+(m?'':' disabled')+'></div></div>'+
  '<div class="f" style="margin-bottom:0"><label for="fa">Assigned to</label>'+(m?staffSel("fa",c.staff_id).replace('<select class="in" id="fa"','<select class="in" id="fa" data-fld="staff_id"'):'<div>'+esc(c.staff_name||"Unassigned")+'</div>')+'</div></div>'+
  '<div class="panel"><h4>Documents</h4>'+((c.docs||[]).length?c.docs.map(function(x){return'<div class="task"><span>'+(x.mime==="application/pdf"?'PDF':'Image')+' · '+esc(x.name)+'<div class="sub">'+fsz(x.size)+'</div></span><button class="btn alt sm" data-doc="'+x.id+'">Open</button>'+(m?'<button class="x" data-rdoc="'+x.id+'" aria-label="Remove document">×</button>':'')+'</div>'}).join(''):'<div class="sub">No documents yet.</div>')+(m?'<label class="btn alt full" for="fu" style="margin-top:12px;color:var(--ink);font-size:15px">+ Add PDF or image</label><input type="file" id="fu" accept="application/pdf,image/*" multiple hidden><div class="sub" id="dn" style="margin-top:8px">PDF or image, up to 5 MB each.</div>':'')+'</div>'+
  '<div class="panel"><h4>Tasks</h4>'+(c.tasks.length?c.tasks.map(function(t){return'<div class="task'+(t.done?' d':'')+'"><input type="checkbox" data-tt="'+t.id+'" aria-label="Done"'+(t.done?' checked':'')+(m?'':' disabled')+'><span>'+esc(t.text)+'</span>'+(m?'<button class="x" data-rt="'+t.id+'" aria-label="Remove task">×</button>':'')+'</div>'}).join(''):'<div class="sub">No tasks yet.</div>')+(m?'<div class="addrow"><input class="in" id="nt2" placeholder="Add a task"><button class="btn" data-addtask="1">Add</button></div>':'')+'</div>'+
  '<div class="panel"><h4>Case notes</h4>'+(m?'<textarea class="in" id="nn" rows="3" placeholder="Write a note about contact, decisions or next steps"></textarea><button class="btn full" data-addnote="1" style="margin:10px 0 16px">Save note</button>':'')+(c.notes.length?c.notes.map(function(n){return'<div class="note"><div class="sub">'+esc(n.author||"")+' · '+new Date(n.ts).toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+'</div><p>'+esc(n.text)+'</p></div>'}).join(''):'<div class="sub">No notes yet.</div>')+'</div>'+
  (m?'<button class="btn warn full" data-del="1">'+(S.del?'Tap again to delete this case':'Delete case')+'</button>':'')+'</div></div>'}
function staffV(){
  return '<div class="page"><div class="wrap">'+top('Staff')+'<div class="hero"><h2>Staff</h2></div>'+info()+
  '<div class="panel"><h4>Telegram bot</h4>'+(BOT?'<p style="margin:0 0 6px" class="ok">Connected: @'+esc(BOT)+'</p><div class="sub">Everyone taps “My Telegram” on the dashboard to receive updates.</div>':'<div class="sub" style="margin-bottom:12px">Create a bot with @BotFather in Telegram, then paste its token here. The token is stored on the server only.</div><div class="f"><label for="bt">Bot token</label><input class="in" id="bt" type="password" autocomplete="off"></div><button class="btn full" data-bot="1"'+(S.busy?' disabled':'')+'>Connect bot</button>')+'</div>'+
  '<div class="panel"><h4>Register staff</h4><div class="sub" style="margin-bottom:12px">Staff sign up and log in with their record card number. If you leave the mobile blank it is linked when they sign up.</div><div class="f"><label for="sn">Name</label><input class="in" id="sn" autocomplete="off"></div><div class="f"><label for="sm">Mobile number (optional)</label><input class="in" id="sm" inputmode="tel"></div><div class="f"><label for="sc">Record card number</label><input class="in" id="sc" autocomplete="off"></div>'+
  (S.err?'<div class="late" style="margin-bottom:12px" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn full" data-addstf="1">Add staff</button></div>'+
  '<div class="panel"><h4>Registered staff</h4>'+(STAFF.length?STAFF.map(function(x){return'<div class="task">'+av(x.name,40)+'<span>'+esc(x.name)+'<div class="sub">'+(x.mobile?esc(x.mobile):'Not signed up yet')+' · Card '+esc(x.card)+(x.telegram?' · Telegram connected':'')+'</div></span>'+(x.signed_up?'<button class="btn alt sm" data-rissue="'+x.id+'">Reset code</button>':'')+'<button class="x" data-rmstf="'+x.id+'" aria-label="Remove staff">×</button></div>'}).join(''):'<div class="sub">No staff registered yet.</div>')+'</div></div></div>'}
function draw(){var a=$("app"),sd=LAY==="side"&&ME&&S.v!=="auth";document.body.className=sd?"side":"";
  function w(h,act){return sd?sideShell(h,act):h}
  if(!ME||S.v==="auth")a.innerHTML=S.mode==="reset"?resetV():authV();
  else if(S.v==="staff"&&isMgr())a.innerHTML=w(staffV(),"staff");
  else if(S.v==="new"&&isMgr())a.innerHTML=w(newV(),"new");
  else if(S.v==="case"&&get(S.id))a.innerHTML=w(caseV(get(S.id)),"list");
  else{S.v="list";a.innerHTML=sd?sideShell(sideList(),"list"):dashV()}
  clearTimeout(TMR);if(S.info&&$("info")&&S.info.indexOf("Reset code")!==0)TMR=setTimeout(function(){S.info="";var e=$("info");if(e)e.remove()},5000)}
function run(p,done){S.busy=true;S.err="";draw();return p.then(function(r){S.busy=false;if(done)return done(r)}).catch(function(e){S.busy=false;if(e.message!=="auth"){S.err=e.message}draw()})}
function reload(msg){return load().then(function(){S.info=msg||"";draw()}).catch(function(e){if(e.message!=="auth"){S.err=e.message;draw()}})}
function act(p,msg){return p.then(function(){return reload(msg)}).catch(function(e){if(e.message!=="auth"){S.info=e.message;draw()}})}
function enter(j){TOK=j.token;ME=j.user;try{localStorage.setItem("caseload-token",TOK)}catch(e){}return load().then(function(){S.v="list";S.err="";S.info="";draw()})}
function tglink(){call("tg_link").then(function(r){window.open(r.url,"_blank","noopener");S.info="Telegram opened. Tap Start in the bot chat, then come back here.";draw()}).catch(function(er){S.info=er.message;draw()})}
$("app").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,c=get(S.id);
  if(d.mode){S.mode=d.mode;S.err="";S.info="";draw()}
  else if(d.rreq){var rm=$("am").value;if(!rm.trim()){S.err="Enter your mobile number first.";draw();return}call("reset_request",{mobile:rm}).then(function(){S.err="";S.info="If your account has Telegram connected, a code was sent there.";draw();$("am").value=rm}).catch(function(er){S.err=er.message;draw()})}
  else if(d.rdo){var m2=$("am").value,cd=$("ar").value,code=$("rc").value,p1=$("ap").value;if(p1!==$("ac").value){S.err="Passwords do not match.";S.info="";draw();return}run(call("reset_do",{mobile:m2,card:cd,code:code,password:p1}),function(){S.mode="login";S.err="";S.info="Password changed. Log in with your new password.";draw()})}
  else if(d.go){var su=S.mode==="signup",m=$("am").value,pw=$("ap").value,card=$("ar").value;
    if(su&&pw!==$("ac").value){S.err="Passwords do not match.";draw();return}
    run(call(su?"signup":"login",{name:su?$("an").value:"",mobile:m,password:pw,card:card}),enter)}
  else if(d.logout){call("logout").catch(function(){});out()}
  else if(d.f){S.f=d.f;draw()}
  else if(d.sf){S.s=S.s===d.sf?"All staff":d.sf;draw()}
  else if(d.day){S.day=S.day===d.day?"":d.day;S.f=S.day?"All":"Active";draw()}
  else if(d.cm){S.cm+=+d.cm;if(S.cm<0){S.cm=11;S.cy--}if(S.cm>11){S.cm=0;S.cy++}draw()}
  else if(d.clearday){S.day="";S.f="Active";draw()}
  else if(d.clear){S.f="Active";S.s="All staff";S.t="All";S.q="";S.day="";draw()}
  else if(d.all){S.f="All";S.s="All staff";S.t="All";S.q="";S.day="";draw()}
  else if(d.lay){LAY=d.lay;try{localStorage.setItem("caseload-layout",LAY)}catch(e){}S.t="All";draw();window.scrollTo(0,0)}
  else if(d.ft){S.f=S.f===d.ft?"Active":d.ft;draw()}
  else if(d.tp){S.t=S.t===d.tp?"All":d.tp;draw()}
  else if(d.tglink){tglink()}
  else if(d.sw==="me"){if(ME.telegram){S.info="Telegram is connected. You will get updates there.";draw()}else tglink()}
  else if(d.sw==="bot"){S.v="staff";S.err="";S.info="";draw();window.scrollTo(0,0)}
  else if(d.st){act(call("case_update",{id:c.id,fields:{status:d.st}}),"Status updated.")}
  else if(d.open){S.v="case";S.id=d.open;S.del=false;S.info="";draw();window.scrollTo(0,0)}
  else if(d.back){S.v="list";S.err="";S.info="";S.del=false;draw();window.scrollTo(0,0)}
  else if(d.new){S.v="new";S.err="";draw();window.scrollTo(0,0)}
  else if(d.staff){S.v="staff";S.err="";S.info="";draw();window.scrollTo(0,0)}
  else if(d.create){var n=$("nc").value.trim();if(!n){$("nc").focus();return}
    run(call("case_create",{client:n,type:$("nt").value,pri:$("nr").value,due:$("nd").value,summary:$("ns").value,staff_id:$("na").value}),function(r){return load().then(function(){S.v="case";S.id=r.id;S.info="Case opened. The assigned staff and manager were notified on Telegram if connected.";draw();window.scrollTo(0,0)})})}
  else if(d.addtask){var t=$("nt2").value.trim();if(t)act(call("task_add",{id:c.id,text:t}))}
  else if(d.rt){act(call("task_remove",{task:+d.rt}))}
  else if(d.addnote){var x=$("nn").value.trim();if(x)act(call("note_add",{id:c.id,text:x}))}
  else if(d.del){if(!S.del){S.del=true;draw()}else call("case_delete",{id:c.id}).then(function(){S.v="list";S.del=false;return reload()}).catch(function(){})}
  else if(d.addstf){S.err="";call("staff_add",{name:$("sn").value,mobile:$("sm").value,card:$("sc").value}).then(function(){return load()}).then(draw).catch(function(er){if(er.message!=="auth"){S.err=er.message;draw()}})}
  else if(d.rmstf){call("staff_remove",{id:d.rmstf}).then(load).then(draw).catch(function(){})}
  else if(d.doc){var w=window.open("","_blank");call("doc_url",{id:+d.doc}).then(function(r){if(w)w.location=r.url;else location.href=r.url}).catch(function(er){if(w)w.close();S.info=er.message;draw()})}
  else if(d.rdoc){act(call("doc_remove",{id:+d.rdoc}),"Document removed.")}
  else if(d.rissue){call("reset_issue",{id:d.rissue}).then(function(r){S.info="Reset code: "+r.code+" (valid 24 hours). Give it to the staff member.";draw()}).catch(function(er){S.info=er.message;draw()})}
  else if(d.bot){var tk=$("bt").value;run(call("bot_setup",{token:tk}),function(r){BOT=r.username;draw()})}
});
$("app").addEventListener("change",function(e){var t=e.target,c=get(S.id);
  if(t.dataset.tt)act(call("task_toggle",{task:+t.dataset.tt,done:t.checked}));
  else if(t.dataset.fld){var f={};f[t.dataset.fld]=t.value;act(call("case_update",{id:c.id,fields:f}),"Saved.")}
  else if(t.id==="fu"){upload(t.files)}
});
$("app").addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;$("cl").innerHTML=items(rows())}});
$("app").addEventListener("keydown",function(e){if(e.key==="Enter"&&S.v==="auth"&&e.target.tagName==="INPUT"){var g=document.querySelector("[data-go]");if(g)g.click()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ME&&S.v==="list")call("me").then(function(j){ME=j.user;return load()}).then(draw).catch(function(){})});
boot();
})();
</script>
</body>
</html>
