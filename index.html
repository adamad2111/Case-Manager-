<style>

.in{width:100%;min-height:48px;border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:11px 14px;min-width:0;font-size:16px}

.chd{margin:4px 0 14px}.chd h2{font-size:28px;line-height:1.1;margin:10px 0 6px}

.sub{color:var(--mute);font-size:13px}.late{color:var(--hit);font-weight:700}.ok{color:#2C8A57;font-weight:700}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:50px}.task:last-of-type{border-bottom:0}
.task input{width:22px;height:22px;accent-color:#17160F}.task.d span{text-decoration:line-through;color:var(--mute)}.task>span:not(.av2){flex:1;min-width:0}
.av2{width:38px;height:38px;border-radius:50%;background:var(--y);color:#17160F;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.x{width:40px;height:40px;border:0;background:none;color:var(--mute);font-size:22px;border-radius:12px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 10px}.note p{margin:4px 0 0;white-space:pre-wrap}
.addrow{display:flex;gap:8px;margin-top:12px}
.alert{background:var(--yt);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.lnk{display:block;border:0;background:none;padding:6px 0;text-align:left;font-weight:700;color:var(--blue);text-decoration:underline;min-height:36px}a{color:var(--blue);font-weight:700}
.mrow{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}.mrow:last-child{border-bottom:0}
.mrow .ic{background:var(--yt);color:#17160F}.mrow .rt{flex:1;display:grid;min-width:0}.mrow .rt b{font-weight:700}
.cal .chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cal .chead b{font-size:18px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.dow{font-size:12.5px;padding:8px 0;font-weight:700}
.d{position:relative;border:0;background:none;height:44px;border-radius:12px;font-size:14px;color:var(--ink)}.d.o{color:var(--mute);opacity:.5}.d.t{color:var(--blue);font-weight:800}.d.sel{background:var(--blue);color:#fff;font-weight:800}
.d i{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}.d.sel i{background:#fff}
.ib2{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--sf);font-size:18px;color:var(--ink)}
.auth-top{background:var(--y);padding:calc(48px + env(safe-area-inset-top,0px)) 20px 70px;text-align:center}.auth-top h1{font-size:30px;letter-spacing:.06em;font-weight:800}.auth-top p{margin:2px 0 0;font-size:13px;font-weight:600}
.sheet{background:var(--bg);border-radius:30px 30px 0 0;margin-top:-40px;padding:22px 20px 40px;min-height:70vh;position:relative}
.sheet h2{text-align:center;font-size:26px}.sheet .sub{text-align:center;margin:2px 0 18px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 0 14px}
.role{border:1.5px solid var(--line);background:var(--sf);border-radius:14px;padding:10px 12px;text-align:left;display:flex;align-items:center;gap:8px}.role small{display:block;font-size:10.5px;color:var(--mute);font-weight:500}.role b{font-size:13px}
.role.on{border-color:var(--y2);background:var(--yt)}.rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}.role.on .rad{border:5px solid var(--y2);background:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px;margin:16px 0}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-weight:700;font-size:14px}
@media print{.nav,.hdr .hb,.week,.stats,.quick,.filt,.tb .back{display:none!important}.item{box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}button:active{transform:none!important}}
</style>

<script>
(function(){

var NW=new Date(),S={v:"list",tab:"home",mode:"login",role:"manager",err:"",q:"",f:"Active",w:"",s:"All staff",day:"",cy:NW.getFullYear(),cm:NW.getMonth(),id:null,busy:false,info:"",del:false},ME=null,CASES=[],STAFF=[],BOT=null,TOK="",TMR=0;

var I={back:'<path d="M15 18l-6-6 6-6"/>',plus:'<path d="M12 5v14M5 12h14"/>',chev:'<path d="M9 6l6 6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',brief:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',tasks:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',dash:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',bld:'<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>',clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h6"/>',flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',send:'<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>',out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'};
function info(){return S.info?'<div class="alert" id="info" role="status">'+esc(S.info)+'</div>':''}

function staffV(){
  return topv('Staff')+'<div class="page">'+info()+
  '<div class="panel"><h4>Telegram bot</h4>'+(BOT?'<p style="margin:0 0 6px" class="ok">Connected: @'+esc(BOT)+'</p><div class="sub">Everyone taps “Connect Telegram” to receive updates.</div>':'<div class="sub" style="margin-bottom:12px">Create a bot with @BotFather in Telegram, then paste its token here. The token is stored on the server only.</div><div class="f"><label for="bt">Bot token</label><input class="in" id="bt" type="password" autocomplete="off"></div><button class="btn full" data-bot="1"'+(S.busy?' disabled':'')+'>Connect bot</button>')+'</div>'+
  '<div class="panel"><h4>Register staff</h4><div class="sub" style="margin-bottom:12px">Staff sign up and log in with their record card number. If you leave the mobile blank it is linked when they sign up.</div><div class="f"><label for="sn">Name</label><input class="in" id="sn" autocomplete="off"></div><div class="f"><label for="sm">Mobile number (optional)</label><input class="in" id="sm" inputmode="tel"></div><div class="f"><label for="sc">Record card number</label><input class="in" id="sc" autocomplete="off"></div>'+
  (S.err?'<div class="late" style="margin-bottom:12px" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn full" data-addstf="1">Add staff</button></div>'+
  '<div class="panel"><h4>Registered staff</h4>'+(STAFF.length?STAFF.map(function(x){return'<div class="task"><span class="av2">'+esc(ini(x.name))+'</span><span>'+esc(x.name)+'<div class="sub">'+(x.mobile?esc(x.mobile):'Not signed up yet')+' · Card '+esc(x.card)+(x.telegram?' · Telegram connected':'')+'</div></span>'+(x.signed_up?'<button class="btn alt sm" data-rissue="'+x.id+'">Reset code</button>':'')+'<button class="x" data-rmstf="'+x.id+'" aria-label="Remove staff">×</button></div>'}).join(''):'<div class="sub">No staff registered yet.</div>')+'</div></div>'}
function draw(){var a=$("app");
  if(!ME||S.v==="auth"){a.innerHTML=S.mode==="reset"?resetV():authV();return}
  var v=S.v,html,act="home";
  if(v==="staff"&&isMgr()){html=staffV();act="staff"}
  else if(v==="new"&&isMgr())html=newV();
  else if(v==="case"&&get(S.id))html=caseV(get(S.id));
  else if(v==="cases")html=casesV();
  else if(v==="tasks")html=tasksV();
  else if(v==="alerts")html=alertsV();
  else{S.v="list";html={home:homeV,cal:calV,more:moreV}[S.tab]();act=S.tab}
  a.innerHTML=html+nav(act);
  clearTimeout(TMR);if(S.info&&$("info")&&S.info.indexOf("Reset code")!==0)TMR=setTimeout(function(){S.info="";var e=$("info");if(e)e.remove()},5000)}
function run(p,done){S.busy=true;S.err="";draw();return p.then(function(r){S.busy=false;if(done)return done(r)}).catch(function(e){S.busy=false;if(e.message!=="auth"){S.err=e.message}draw()})}
function reload(msg){return load().then(function(){S.info=msg||"";draw()}).catch(function(e){if(e.message!=="auth"){S.err=e.message;draw()}})}
function act(p,msg){return p.then(function(){return reload(msg)}).catch(function(e){if(e.message!=="auth"){S.info=e.message;draw()}})}
function enter(j){TOK=j.token;ME=j.user;try{localStorage.setItem("caseload-token",TOK)}catch(e){}return load().then(function(){S.v="list";S.tab="home";S.err="";S.info="";draw()})}
function tglink(){call("tg_link").then(function(r){window.open(r.url,"_blank","noopener");S.info="Telegram opened. Tap Start in the bot chat, then come back here.";draw()}).catch(function(er){S.info=er.message;draw()})}
function go(v){S.v=v;S.err="";S.info="";S.del=false;draw();window.scrollTo(0,0)}
$("app").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,c=get(S.id);
  if(d.mode){S.mode=d.mode;S.err="";S.info="";draw()}
  else if(d.role){S.role=d.role;draw()}
  else if(d.rreq){var rm=$("am").value;if(!rm.trim()){S.err="Enter your mobile number first.";draw();return}call("reset_request",{mobile:rm}).then(function(){S.err="";S.info="If your account has Telegram connected, a code was sent there.";draw();$("am").value=rm}).catch(function(er){S.err=er.message;draw()})}
  else if(d.rdo){var m2=$("am").value,cd=$("ar").value,code=$("rc").value,p1=$("ap").value;if(p1!==$("ac").value){S.err="Passwords do not match.";S.info="";draw();return}run(call("reset_do",{mobile:m2,card:cd,code:code,password:p1}),function(){S.mode="login";S.err="";S.info="Password changed. Log in with your new password.";draw()})}
  else if(d.go){var su=S.mode==="signup",m=$("am").value,pw=$("ap").value,card=$("ar")?$("ar").value:"";
    if(su&&pw!==$("ac").value){S.err="Passwords do not match.";draw();return}
    run(call(su?"signup":"login",{name:su?$("an").value:"",mobile:m,password:pw,card:card}),enter)}
  else if(d.logout){call("logout").catch(function(){});out()}
  else if(d.tab){S.tab=d.tab;S.v="list";S.err="";S.info="";S.del=false;draw();window.scrollTo(0,0)}
  else if(d.print!==undefined){window.print()}
  else if(d.openAlerts!==undefined){go("alerts")}
  else if(d.w){S.w=S.w===d.w?"":d.w;draw()}
  else if(d.day){S.day=S.day===d.day?"":d.day;draw()}
  else if(d.day2){S.day=S.day===d.day2?"":d.day2;draw()}
  else if(d.cm){S.cm+=+d.cm;if(S.cm<0){S.cm=11;S.cy--}if(S.cm>11){S.cm=0;S.cy++}draw()}
  else if(d.go2){var g=d.go2;if(g==="cal"){S.tab="cal";S.v="list";draw();window.scrollTo(0,0)}else if(g==="cases"){S.f="Active";S.q="";go("cases")}else go(g)}
  else if(d.f){S.f=d.f;draw()}
  else if(d.st){act(call("case_update",{id:c.id,fields:{status:d.st}}),"Status updated.")}
  else if(d.open){S.v="case";S.id=d.open;S.del=false;S.info="";draw();window.scrollTo(0,0)}
  else if(d.back){S.v="list";S.err="";S.info="";S.del=false;draw();window.scrollTo(0,0)}
  else if(d.staff){go("staff")}
  else if(d.tglink){if(ME.telegram){S.info="Telegram is already connected.";draw()}else tglink()}
  else if(d.create){var n=$("nc").value.trim();if(!n){$("nc").focus();return}
    run(call("case_create",{client:n,type:$("nt").value,pri:$("nr").value,due:$("nd").value,summary:$("ns").value,staff_id:$("na").value}),function(r){return load().then(function(){S.v="case";S.id=r.id;S.info="Case opened. The assigned staff and manager were notified on Telegram if connected.";draw();window.scrollTo(0,0)})})}
  else if(d.addtask){var t=$("nt2").value.trim();if(t)act(call("task_add",{id:c.id,text:t}))}
  else if(d.rt){act(call("task_remove",{task:+d.rt}))}
  else if(d.addnote){var x=$("nn").value.trim();if(x)act(call("note_add",{id:c.id,text:x}))}
  else if(d.del){if(!S.del){S.del=true;draw()}else call("case_delete",{id:c.id}).then(function(){S.v="list";S.del=false;return reload()}).catch(function(){})}
  else if(d.addstf){S.err="";call("staff_add",{name:$("sn").value,mobile:$("sm").value,card:$("sc").value}).then(function(){return load()}).then(draw).catch(function(er){if(er.message!=="auth"){S.err=er.message;draw()}})}
  else if(d.rmstf){call("staff_remove",{id:d.rmstf}).then(load).then(draw).catch(function(){})}
  else if(d.doc){var w=window.open("","_blank");call("doc_url",{id:+d.doc}).then(function(r){if(w)w.location=r.url;else location.href=r.url}).catch(function(er){if(w)w.close();S.info=er.message;draw()})}
  else if(d.rdoc){act(call("doc_remove",{id:+d.rdoc}),"Document removed.")}
  else if(d.rissue){call("reset_issue",{id:d.rissue}).then(function(r){S.info="Reset code: "+r.code+" (valid 24 hours). Give it to the staff member.";draw()}).catch(function(er){S.info=er.message;draw()})}
  else if(d.bot){var tk=$("bt").value;run(call("bot_setup",{token:tk}),function(r){BOT=r.username;draw()})}
});
$("app").addEventListener("change",function(e){var t=e.target,c=get(S.id);
  if(t.dataset.tt)act(call("task_toggle",{task:+t.dataset.tt,done:t.checked}));
  else if(t.dataset.fld){var f={};f[t.dataset.fld]=t.value;act(call("case_update",{id:c.id,fields:f}),"Saved.")}
  else if(t.id==="fu"){upload(t.files)}
  else if(t.id==="fst"){S.s=t.value;draw()}
  else if(t.id==="fsx"){S.f=t.value;draw()}
});
$("app").addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;$("cl").innerHTML=listh()}});
$("app").addEventListener("keydown",function(e){if(e.key==="Enter"&&S.v==="auth"&&e.target.tagName==="INPUT"){var g=document.querySelector("[data-go]");if(g)g.click()}});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ME&&S.v==="list")call("me").then(function(j){ME=j.user;return load()}).then(draw).catch(function(){})});
boot();
})();
</script>
</body>
</html>
