<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caseload – case manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F3F4F8;--sf:#fff;--ink:#17213A;--mute:#66708A;--line:#DDE1EC;--brand:#1F3A6B;--bi:#fff;--acc:#E4572E;--hi:#FBE0D8;--hit:#9A2B0E;--md:#FFF0C7;--mdt:#6B4B00;--lo:#E6E9F2;--lot:#4A546E;--ok:#DAF1E3;--okt:#0B5B3B;--sh:0 1px 2px rgba(23,33,58,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--sf:#172038;--ink:#E8ECF7;--mute:#97A2BE;--line:#27324F;--brand:#8FB0F5;--bi:#0E1424;--acc:#FF8A63;--hi:#432019;--hit:#FFB9A3;--md:#3B3210;--mdt:#FFD97A;--lo:#27324F;--lot:#B4BED6;--ok:#14382B;--okt:#8FE3BC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1424;--sf:#172038;--ink:#E8ECF7;--mute:#97A2BE;--line:#27324F;--brand:#8FB0F5;--bi:#0E1424;--acc:#FF8A63;--hi:#432019;--hit:#FFB9A3;--md:#3B3210;--mdt:#FFD97A;--lo:#27324F;--lot:#B4BED6;--ok:#14382B;--okt:#8FE3BC;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif}
h1,h2,h3,.big{font-family:Fraunces,Georgia,serif;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:680px;margin:0 auto;padding:16px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:30px;letter-spacing:-.01em}
.btn{border:0;border-radius:12px;background:var(--brand);color:var(--bi);font-weight:700;padding:11px 16px}
.btn.alt{background:var(--sf);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--hi);color:var(--hit)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.st{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--sh)}
.st .big{font-size:26px;font-weight:700;line-height:1}
.st span{font-size:12px;color:var(--mute)}
.st.hot .big{color:var(--acc)}
.bar{display:flex;gap:8px;margin-bottom:12px}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--sf);border-radius:12px;padding:10px 12px;min-width:0}
.card{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card b{font-size:16px}
.sub{color:var(--mute);font-size:13px}
.tag{display:inline-block;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;background:var(--lo);color:var(--lot)}
.tag.High{background:var(--hi);color:var(--hit)}.tag.Medium{background:var(--md);color:var(--mdt)}.tag.Closed{background:var(--ok);color:var(--okt)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.late{color:var(--hit);font-weight:700}
.empty{text-align:center;color:var(--mute);padding:32px 0}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.panel h3{font-size:17px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px}
.f{margin-bottom:10px}
.task{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;accent-color:var(--brand)}
.task.d span{text-decoration:line-through;color:var(--mute)}
.task span{flex:1}
.x{border:0;background:none;color:var(--mute);font-size:18px}
.note{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:0 0 12px}
.note p{margin:2px 0;white-space:pre-wrap}
.add{display:flex;gap:8px;margin-top:10px}
a{color:var(--brand);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.modal.show{display:flex}
.sheet{background:var(--sf);border-radius:18px;padding:12px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center}.sheet img{width:100%;max-height:56vh;object-fit:contain;border-radius:10px;background:var(--lo)}
.alert{background:var(--md);color:var(--mdt);border-radius:14px;padding:12px 14px;margin-bottom:12px}.alert b{display:block;margin-bottom:4px}
.lnk{display:block;border:0;background:none;padding:5px 0;text-align:left;font-weight:600;color:inherit;text-decoration:underline}
.pdf{display:grid;place-items:center;height:140px;border-radius:10px;background:var(--lo);font:700 28px Fraunces,serif;color:var(--lot)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;justify-content:center;align-items:center}.acts .go{flex:1 1 100%;border:0;border-radius:12px;background:var(--brand);color:var(--bi);font-weight:700;padding:12px}.acts .chip{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:8px 14px;text-decoration:none;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{flex-wrap:wrap}.bar #q{flex:1 1 100%}.bar select{flex:1 1 0}
@media (max-width:420px){.grid{grid-template-columns:1fr}.stats .st{padding:8px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="vm"></div>
<script>
(function(){
var TYPES=["Memo","Letter","Other"],ST=["Open","In progress","On hold","Closed"],PR=["High","Medium","Low"];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function plus(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function fd(s){return s?new Date(s+"T00:00:00").toLocaleDateString([],{month:"short",day:"numeric"}):"No due date"}
function now(){return new Date().toLocaleString([],{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
var D={seq:3,cases:[
 {id:"C-001",client:"Amina Hassan",phone:"",type:"Housing",pri:"High",status:"In progress",due:plus(-1),summary:"Sample case: facing eviction notice, needs temporary housing options.",notes:[{t:"Initial intake done. Landlord notice dated last week.",ts:now()}],tasks:[{t:"Collect lease copy",done:true},{t:"Call housing office",done:false}]},
 {id:"C-002",client:"Rahul Menon",phone:"",type:"Health",pri:"Medium",status:"Open",due:plus(5),summary:"Sample case: follow-up on referral to specialist clinic.",notes:[],tasks:[{t:"Confirm appointment date",done:false}]}]};
var KEY="caseload-v1";
function load(){D={seq:1,cases:[]};try{var r=localStorage.getItem(KEY)||(isMgr()?localStorage.getItem("caseload-v1-"+ME.mobile)||localStorage.getItem("caseload-v1"):null);if(r)D=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
var S={v:"list",s:"All staff",q:"",f:"Active",id:null,del:false};
function stf(c){return S.s==="All staff"||(S.s==="Unassigned"?!c.staff:c.staff===S.s)}
function staffNames(){var s=[];D.cases.forEach(function(c){if(c.staff&&s.indexOf(c.staff)<0)s.push(c.staff)});STF.forEach(function(x){if(s.indexOf(x.name)<0)s.push(x.name)});return s}
function staffOpts(){var s=staffNames();return '<datalist id="sl">'+s.map(function(n){return'<option value="'+esc(n)+'">'}).join('')+'</datalist>'}
var DB=null,VD=null;
function idb(){return new Promise(function(res){if(DB||!window.indexedDB)return res(DB);try{var r=indexedDB.open("caseload-docs",1);r.onupgradeneeded=function(){r.result.createObjectStore("f")};r.onsuccess=function(){DB=r.result;res(DB)};r.onerror=function(){res(null)}}catch(e){res(null)}})}
function fop(mode,fn){return idb().then(function(d){if(!d)return null;return new Promise(function(res){try{var t=d.transaction("f",mode),rq=fn(t.objectStore("f"));t.oncomplete=function(){res(rq&&rq.result!==undefined?rq.result:true)};t.onerror=function(){res(null)}}catch(e){res(null)}})})}
function fput(k,b){return fop("readwrite",function(s){return s.put(b,k)})}
function fget(k){return fop("readonly",function(s){return s.get(k)})}
function fdel(k){return fop("readwrite",function(s){return s.delete(k)})}
function fsz(b){return b<1048576?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(1)+" MB"}
function addFiles(fl){var c=get(S.id),bad=0;c.docs=c.docs||[];Promise.all([].slice.call(fl).map(function(f,i){var pdf=f.type==="application/pdf";if(!(pdf||f.type.indexOf("image/")===0)||f.size>10485760){bad++;return null}var id="d"+Date.now()+i;return fput(id,f).then(function(s){if(s)c.docs.push({id:id,name:f.name,type:pdf?"pdf":"image",size:f.size});else bad++})})).then(function(){save();draw();if(bad&&$("dn"))$("dn").textContent=bad+" file(s) skipped. Only PDF or image files up to 10 MB can be added."})}
function showDoc(x,bl){var u="";try{u=URL.createObjectURL(bl)}catch(e){}function paint(src){VD={x:x,b:bl};$("vm").innerHTML='<div class="sheet">'+(src?'<img alt="'+esc(x.name)+'" src="'+src+'">':'<div class="pdf">PDF</div>')+'<div class="sub" style="margin-top:8px">'+esc(x.name)+'</div><div class="acts"><button class="go" data-dsave="1">Save to phone</button>'+(u?'<a class="chip" target="_blank" rel="noopener" href="'+u+'">Open</a>':'')+'<button class="chip" data-dclose="1">Close</button></div></div>';$("vm").className="modal show"}if(x.type==="image"){var r=new FileReader();r.onload=function(){paint(r.result)};r.readAsDataURL(bl)}else paint("")}
function isMgr(){return !ME||ME.role==="manager"}
function sp(c){var a=(c.staffPhone||"").replace(/\D/g,""),b=ME.mobile.replace(/\D/g,"");return b.length>=7&&((a.length>=7&&a.slice(-7)===b.slice(-7))||STF.some(function(s){var x=dgt(s.mobile);return x.length>=7&&x.slice(-7)===b.slice(-7)&&s.name===c.staff}))}
function vis(c){return isMgr()||sp(c)}
function get(id){return D.cases.filter(function(c){return c.id===id&&vis(c)})[0]}
function late(c){return c.status!=="Closed"&&c.due&&c.due<iso(new Date())}
function sel(id,arr,v,fld){return '<select class="in" id="'+id+'"'+(fld?' data-fld="'+fld+'"':'')+(ME&&!isMgr()&&fld&&fld!=="status"?' disabled':'')+'>'+arr.map(function(o){return'<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'}
function list(){
  if(S.s!=="All staff"&&S.s!=="Unassigned"&&staffNames().indexOf(S.s)<0)S.s="All staff";var t=iso(new Date()),w=plus(7),open=D.cases.filter(function(c){return vis(c)&&c.status!=="Closed"&&stf(c)});
  var hi=open.filter(function(c){return c.pri==="High"}).length,ov=open.filter(late).length,wk=open.filter(function(c){return c.due&&c.due>=t&&c.due<=w}).length;
  var q=S.q.toLowerCase();
  var rows=D.cases.filter(function(c){
    if(!vis(c))return false;
    if(q&&(c.client+" "+c.id+" "+c.type).toLowerCase().indexOf(q)<0)return false;
    if(!stf(c))return false;
    return S.f==="All"||(S.f==="Active"?c.status!=="Closed":c.status===S.f)}).sort(function(a,b){
    if((a.status==="Closed")!==(b.status==="Closed"))return a.status==="Closed"?1:-1;
    return (a.due||"9999").localeCompare(b.due||"9999")});
  var h='<div class="top"><h1>Caseload</h1><div style="display:flex;gap:8px"><button class="btn alt" data-logout="1">Log out</button>'+(isMgr()?'<button class="btn alt" data-staff="1">Staff</button><button class="btn" data-new="1">+ New case</button>':'')+'</div></div><div class="sub" style="margin:-6px 0 12px">Signed in as '+esc(ME.name)+' · '+esc(ME.mobile)+' · '+(isMgr()?'Manager':'Staff')+'</div>'+dueBanner()+
  '<div class="stats"><div class="st"><div class="big">'+open.length+'</div><span>Open</span></div><div class="st'+(hi?' hot':'')+'"><div class="big">'+hi+'</div><span>High priority</span></div><div class="st'+(ov?' hot':'')+'"><div class="big">'+ov+'</div><span>Overdue</span></div><div class="st"><div class="big">'+wk+'</div><span>Due in 7 days</span></div></div>'+
  '<div class="bar"><input class="in" id="q" placeholder="Search client, ID or type" value="'+esc(S.q)+'"><select class="in" id="fl" style="width:auto">'+["Active","All"].concat(ST).map(function(o){return'<option'+(o===S.f?' selected':'')+'>'+o+'</option>'}).join('')+'</select>'+(isMgr()&&staffNames().length?'<select class="in" id="fst" style="width:auto" aria-label="Filter by staff">'+["All staff","Unassigned"].concat(staffNames()).map(function(o){return'<option'+(o===S.s?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>':'')+'</div><div id="cl">'+cards(rows)+'</div>';
  return h}
function cards(rows){
  if(!rows.length)return '<div class="empty">No cases match. Tap “New case” to add one.</div>';
  return rows.map(function(c){var dn=c.tasks.filter(function(x){return x.done}).length;
    return '<button class="card" data-open="'+c.id+'"><div class="row"><b>'+esc(c.client)+'</b><span class="tag '+c.pri+'">'+c.pri+'</span></div><div class="sub">'+c.id+' · '+esc(c.type)+(c.staff?' · '+esc(c.staff):'')+'</div><div class="meta"><span class="tag '+(c.status==="Closed"?"Closed":"")+'">'+c.status+'</span><span class="'+(late(c)?'late':'sub')+'">'+(late(c)?'Overdue · ':'Due ')+fd(c.due)+'</span>'+(c.tasks.length?'<span class="sub">'+dn+'/'+c.tasks.length+' tasks</span>':'')+'</div></button>'}).join('')}
function form(){
  return '<div class="top"><h1>New case</h1><button class="btn alt" data-back="1">Cancel</button></div><div class="panel">'+
  '<div class="f"><label for="nc">Client name</label><input class="in" id="nc" autocomplete="off"></div>'+
  '<div class="f"><label for="na">Assigned to (staff)</label><input class="in" id="na" list="sl" autocomplete="off">'+staffOpts()+'</div>'+
  '<div class="f"><label for="np">Staff phone number</label><input class="in" id="np" inputmode="tel"></div>'+
  '<div class="grid"><div class="f"><label for="nt">Type</label>'+sel("nt",TYPES,"Memo")+'</div><div class="f"><label for="nr">Priority</label>'+sel("nr",PR,"Medium")+'</div><div class="f"><label for="nd">Due date</label><input class="in" type="date" id="nd" value="'+plus(7)+'"></div></div>'+
  '<div class="f"><label for="ns">Summary</label><textarea class="in" id="ns" rows="3"></textarea></div><button class="btn" data-create="1" style="width:100%">Create case</button></div>'}
function tgMsg(c,ph){var L=["Case "+c.id+" – "+c.client,c.type+" · "+c.pri+" priority · "+c.status,"Due: "+fd(c.due)];if(c.staff)L.push("Assigned to: "+c.staff);if(c.staffPhone)L.push("Staff phone: "+c.staffPhone);if((c.docs||[]).length)L.push("Documents: "+c.docs.map(function(x){return x.name}).join(", "));if(c.summary)L.push("","Summary: "+c.summary);var ot=c.tasks.filter(function(t){return !t.done});if(ot.length){L.push("","Open tasks:");ot.forEach(function(t){L.push("- "+t.t)})}if(c.notes.length)L.push("","Latest note ("+c.notes[0].ts+"): "+c.notes[0].t);return L.join("\n")}
function tgUrl(c,ph){return "https://t.me/share/url?url=%20&text="+encodeURIComponent(tgMsg(c,ph))}
function detail(c){
  var h='<div class="top"><button class="btn alt" data-back="1">← Cases</button><span class="sub">'+c.id+' · '+esc(c.type)+'</span></div>'+
  '<h2 style="font-size:26px;margin-bottom:2px">'+esc(c.client)+'</h2>'+(c.staffPhone?'<div class="sub" style="margin-bottom:10px">'+esc(c.staff||"Staff")+' · <a href="tel:'+esc(c.staffPhone.replace(/[^\d+]/g,""))+'">'+esc(c.staffPhone)+'</a></div>':'<div style="height:10px"></div>')+
  '<div class="panel"><div class="grid"><div class="f"><label for="fs">Status</label>'+sel("fs",ST,c.status,"status")+'</div><div class="f"><label for="fp">Priority</label>'+sel("fp",PR,c.pri,"pri")+'</div><div class="f"><label for="fdv">Due</label><input class="in" type="date" id="fdv" data-fld="due"'+(isMgr()?'':' disabled')+' value="'+esc(c.due)+'"></div></div><div class="grid2"><div class="f"><label for="fa">Assigned to</label><input class="in" id="fa" list="sl" data-fld="staff" autocomplete="off"'+(isMgr()?'':' disabled')+' value="'+esc(c.staff||"")+'">'+staffOpts()+'</div><div class="f"><label for="fsp">Staff phone</label><input class="in" id="fsp" inputmode="tel" data-fld="staffPhone"'+(isMgr()?'':' disabled')+' value="'+esc(c.staffPhone||"")+'"></div></div>'+(c.summary?'<p style="margin:4px 0 0">'+esc(c.summary)+'</p>':'')+'</div>'+
  '<div class="panel"><h3>Documents</h3>'+((c.docs||[]).length?c.docs.map(function(x){return'<div class="task"><span>'+(x.type==="pdf"?'PDF':'Image')+' · '+esc(x.name)+'<div class="sub">'+fsz(x.size)+'</div></span><button class="btn alt" data-vd="'+x.id+'" style="padding:6px 12px">Open</button>'+(isMgr()?'<button class="x" data-rd="'+x.id+'" aria-label="Remove document">×</button>':'')+'</div>'}).join(''):'<div class="sub">No documents yet.</div>')+(isMgr()?'<label class="btn alt" for="fu" style="display:block;text-align:center;margin-top:10px">+ Add PDF or image</label><input type="file" id="fu" accept="application/pdf,image/*" multiple hidden><div class="sub" id="dn" style="margin-top:6px"></div>':'')+'</div>'+
  '<div class="panel"><h3>Tasks</h3>'+(c.tasks.length?c.tasks.map(function(t,i){return'<div class="task'+(t.done?' d':'')+'"><input type="checkbox" data-tt="'+i+'" aria-label="Done"'+(t.done?' checked':'')+(isMgr()?'':' disabled')+'><span>'+esc(t.t)+'</span>'+(isMgr()?'<button class="x" data-rt="'+i+'" aria-label="Remove task">×</button>':'')+'</div>'}).join(''):'<div class="sub">No tasks yet.</div>')+
  (isMgr()?'<div class="add"><input class="in" id="nt2" placeholder="Add a task"><button class="btn" data-addtask="1">Add</button></div>':'')+'</div>'+
  '<div class="panel"><h3>Case notes</h3>'+(isMgr()?'<textarea class="in" id="nn" rows="3" placeholder="Write a note about contact, decisions or next steps"></textarea><div class="add"><button class="btn" data-addnote="1" style="width:100%">Save note</button></div>':'')+'<div style="margin-top:16px">'+
  (c.notes.length?c.notes.map(function(n){return'<div class="note"><div class="sub">'+esc(n.ts)+'</div><p>'+esc(n.t)+'</p></div>'}).join(''):'<div class="sub">No notes yet.</div>')+'</div></div>'+
  '<div class="panel"><h3>Send to staff</h3><div class="sub" style="margin-bottom:10px">Opens Telegram so you can pick the staff member or group. Includes the summary, open tasks and latest note.</div><a class="btn" id="tga" target="_blank" rel="noopener" href="'+esc(tgUrl(c,false))+'" style="display:block;text-align:center;text-decoration:none;margin-top:10px">Send via Telegram</a><div class="sub" style="margin:12px 0 6px">If Telegram doesn’t open, copy this message and paste it into your chat:</div><textarea class="in" id="tgm" rows="5" readonly>'+esc(tgMsg(c,false))+'</textarea><button class="btn alt" data-tgcopy="1" style="width:100%;margin-top:8px">Copy message</button></div>'+
  (isMgr()?'<button class="btn warn" data-del="1" style="width:100%">'+(S.del?'Tap again to delete this case':'Delete case')+'</button>':'');
  return h}
function draw(){var a=$("app");
  if(S.v==="staff"&&isMgr())a.innerHTML=staffView();
  else if(S.v==="new")a.innerHTML=form();
  else if(S.v==="case"&&get(S.id))a.innerHTML=detail(get(S.id));
  else{S.v="list";a.innerHTML=list()}}
function rerenderList(){var rows=D.cases.filter(function(c){if(!vis(c))return false;var q=S.q.toLowerCase();if(q&&(c.client+" "+c.id+" "+c.type).toLowerCase().indexOf(q)<0)return false;if(!stf(c))return false;return S.f==="All"||(S.f==="Active"?c.status!=="Closed":c.status===S.f)}).sort(function(a,b){if((a.status==="Closed")!==(b.status==="Closed"))return a.status==="Closed"?1:-1;return (a.due||"9999").localeCompare(b.due||"9999")});$("cl").innerHTML=cards(rows)}
$("app").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,c=get(S.id);
  if(!isMgr()&&(d.addtask||d.rt!==undefined||d.addnote||d.rd||d.create||d.new||d.del||d.export||d.staff||d.addstf||d.rmstf))return;
  if(d.logout){try{localStorage.removeItem("caseload-session")}catch(er){}ME=null;authView("login")}
  else if(d.mode){authView(d.mode)}
  else if(d.staff){S.v="staff";S.err="";draw()}
  else if(d.addstf){var sn=$("sn").value.trim(),sm=$("sm").value.replace(/[^\d+]/g,""),sc=$("sc").value.trim();S.err="";if(!sn||!sc)S.err="Enter the name and record card number.";else if(sm&&(dgt(sm).length<7||dgt(sm).length>15))S.err="Enter a valid mobile number.";else if(sm&&STF.some(function(x){return dgt(x.mobile).slice(-7)===dgt(sm).slice(-7)}))S.err="This mobile number is already registered.";else if(STF.some(function(x){return String(x.card).trim().toLowerCase()===sc.toLowerCase()}))S.err="This record card number is already registered.";if(!S.err){STF.push({name:sn,mobile:sm,card:sc});saveStf()}draw()}
  else if(d.rmstf!==undefined){STF.splice(+d.rmstf,1);saveStf();draw()}
  else if(d.export){var js=JSON.stringify({exported:iso(new Date()),owner:ME.mobile,cases:D.cases.map(function(c){return{id:c.id,client:c.client,type:c.type,pri:c.pri,status:c.status,due:c.due,staff:c.staff||"",staffPhone:c.staffPhone||""}})},null,2);var dl=window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null);dl.then(function(s){if(!s)throw 0;return s.save({filename:"cases.json",data:new Blob([js],{type:"application/json"})})}).then(function(){b.textContent="Exported ✓"}).catch(function(){$("vm").innerHTML='<div class="sheet"><div class="sub" style="margin-bottom:8px">Copy this text into a file named cases.json</div><textarea class="in" rows="10" readonly>'+esc(js)+'</textarea><div class="acts"><button class="chip" data-dclose="1">Close</button></div></div>';$("vm").className="modal show"})}
  else if(d.notif){try{Notification.requestPermission().then(function(){notifyDue();draw()})}catch(er){}}
  else if(d.go){submitAuth(d.go)}
  else if(d.open){S.v="case";S.id=d.open;S.del=false;draw();window.scrollTo(0,0)}
  else if(d.back){S.v="list";S.del=false;draw()}
  else if(d.new){S.v="new";draw()}
  else if(d.create){var n=$("nc").value.trim();if(!n){$("nc").focus();return}
    var id="C-"+String(D.seq++).padStart(3,"0");D.cases.push({id:id,client:n,staffPhone:$("np").value.trim(),staff:$("na").value.trim(),type:$("nt").value,pri:$("nr").value,status:"Open",due:$("nd").value,summary:$("ns").value.trim(),notes:[],tasks:[]});save();S.v="case";S.id=id;draw()}
  else if(d.addtask){var t=$("nt2").value.trim();if(t){c.tasks.push({t:t,done:false});save();draw()}}
  else if(d.rt!==undefined){c.tasks.splice(+d.rt,1);save();draw()}
  else if(d.addnote){var x=$("nn").value.trim();if(x){c.notes.unshift({t:x,ts:now()});save();draw()}}
  else if(d.vd){var dx=(c.docs||[]).filter(function(k){return k.id===d.vd})[0];fget(d.vd).then(function(bl){if(bl&&bl!==true)showDoc(dx,bl);else b.textContent="File not found"})}
  else if(d.rd){fdel(d.rd);c.docs=c.docs.filter(function(k){return k.id!==d.rd});save();draw()}
  else if(d.tgcopy){var ta=$("tgm");ta.focus();ta.select();ta.setSelectionRange(0,99999);var ok=false;try{ok=document.execCommand("copy")}catch(er){}b.textContent=ok?"Copied ✓":"Select the text above and copy it";setTimeout(function(){b.textContent="Copy message"},2200)}
  else if(d.del){if(!S.del){S.del=true;draw()}else{(c.docs||[]).forEach(function(x){fdel(x.id)});D.cases=D.cases.filter(function(k){return k.id!==c.id});save();S.v="list";S.del=false;draw()}}
});
$("app").addEventListener("change",function(e){var t=e.target,c=get(S.id);if(!isMgr()&&(t.dataset.tt!==undefined||t.id==="fu"||(t.dataset.fld&&t.dataset.fld!=="status")))return;
  if(t.dataset.tt!==undefined){c.tasks[+t.dataset.tt].done=t.checked;save();draw()}
  else if(t.dataset.fld){c[t.dataset.fld]=t.value;save();if(t.dataset.fld==="status"||t.dataset.fld==="pri")draw();else if($("tga")){$("tga").href=tgUrl(c);$("tgm").value=tgMsg(c)}}
  else if(t.id==="fl"){S.f=t.value;rerenderList()}
  else if(t.id==="fu"){addFiles(t.files)}
  else if(t.id==="na"){var pf=STF.filter(function(x){return x.name===t.value})[0]||D.cases.filter(function(k){return k.staff===t.value&&k.staffPhone})[0];if(pf&&!$("np").value)$("np").value=pf.mobile||pf.staffPhone||""}
  else if(t.id==="fst"){S.s=t.value;draw()}
  
});
$("vm").addEventListener("click",function(e){var b=e.target.closest("button");if(e.target===$("vm")||(b&&b.dataset.dclose)){$("vm").className="modal";return}if(b&&b.dataset.dsave){var dl=window.claude&&claude.use?claude.use("downloads"):Promise.resolve(null);dl.then(function(s){if(!s){b.textContent="Use Open instead";return}return s.save({filename:VD.x.name,data:VD.b}).then(function(){b.textContent="Saved ✓"})}).catch(function(){b.textContent="Use Open instead"})}});
$("app").addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;rerenderList()}});
function dueLists(){var t=iso(new Date()),n=plus(1),r={tom:[],today:[],over:[]};D.cases.forEach(function(c){if(!vis(c)||c.status==="Closed"||!c.due)return;if(c.due===n)r.tom.push(c);else if(c.due===t)r.today.push(c);else if(c.due<t)r.over.push(c)});return r}
function dueBanner(){var r=dueLists(),ln=function(l,a){return a.map(function(c){return'<button class="lnk" data-open="'+c.id+'">'+l+' · '+esc(c.client)+' ('+c.id+')</button>'}).join('')},h=ln("Due tomorrow",r.tom)+ln("Due today",r.today)+ln("Overdue",r.over),np=window.Notification&&Notification.permission==="default"?'<button class="btn alt" data-notif="1" style="margin:0 0 12px;width:100%">Turn on device notifications</button>':'';return(h?'<div class="alert" role="status"><b>Reminders for '+esc(ME.mobile)+'</b>'+h+'</div>':'')+np+(isMgr()?'<button class="btn alt" data-export="1" style="margin:0 0 12px;width:100%">Export cases for Telegram bot</button>':'')}
function notifyDue(){try{if(!window.Notification||Notification.permission!=="granted")return;var k="caseload-notified-"+ME.mobile,seen={},t=iso(new Date());try{seen=JSON.parse(localStorage.getItem(k)||"{}")}catch(e){}dueLists().tom.forEach(function(c){var key=c.id+"|"+c.due;if(seen[key]===t)return;seen[key]=t;new Notification("Case due tomorrow",{body:c.client+" ("+c.id+") is due "+fd(c.due)+"."})});localStorage.setItem(k,JSON.stringify(seen))}catch(e){}}
var STF=[];try{STF=JSON.parse(localStorage.getItem("caseload-staff")||"[]");if(!STF.length&&!localStorage.getItem("caseload-staff-seeded")){STF=[{name:"Adam Haleem",mobile:"",card:"96074"},{name:"Ali Faris",mobile:"",card:"49308"},{name:"Mohamed Yasir",mobile:"",card:"58770"}];localStorage.setItem("caseload-staff",JSON.stringify(STF));localStorage.setItem("caseload-staff-seeded","1")}}catch(e){}
function saveStf(){try{localStorage.setItem("caseload-staff",JSON.stringify(STF))}catch(e){}}
function dgt(s){return String(s||"").replace(/\D/g,"")}
function findStf(m,card){var d=dgt(m).slice(-7),cd=String(card||"").trim().toLowerCase();return STF.filter(function(s){return String(s.card).trim().toLowerCase()===cd&&(!dgt(s.mobile)||dgt(s.mobile).slice(-7)===d)})[0]}
function staffView(){return '<div class="top"><h1>Staff</h1><button class="btn alt" data-back="1">← Cases</button></div><div class="panel"><h3>Register staff</h3><div class="sub" style="margin-bottom:10px">Staff sign up and log in with their record card number. If you leave the mobile blank, it is linked when they first sign up.</div><div class="f"><label for="sn">Name</label><input class="in" id="sn" autocomplete="off"></div><div class="f"><label for="sm">Mobile number (optional)</label><input class="in" id="sm" inputmode="tel"></div><div class="f"><label for="sc">Record card number</label><input class="in" id="sc" autocomplete="off"></div>'+(S.err?'<div class="late" style="margin-bottom:10px" role="alert">'+esc(S.err)+'</div>':'')+'<button class="btn" data-addstf="1" style="width:100%">Add staff</button></div><div class="panel"><h3>Registered staff</h3>'+(STF.length?STF.map(function(x,i){return'<div class="task"><span>'+esc(x.name)+'<div class="sub">'+(x.mobile?esc(x.mobile):'Not signed up yet')+' · Card '+esc(x.card)+'</div></span><button class="x" data-rmstf="'+i+'" aria-label="Remove staff">×</button></div>'}).join(''):'<div class="sub">No staff registered yet.</div>')+'</div>'}
var US={},ME=null;try{US=JSON.parse(localStorage.getItem("caseload-users")||"{}")}catch(e){}
function hex(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return("0"+x.toString(16)).slice(-2)}).join("")}
function hashPw(s,p){if(window.crypto&&crypto.subtle&&window.TextEncoder)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s+":"+p)).then(hex);return Promise.resolve(btoa(unescape(encodeURIComponent(s+p))))}
function authView(mode,err,keep,kn,kc){var su=mode==="signup";$("app").innerHTML='<div class="top"><h1>Caseload</h1></div><div class="panel"><div class="grid2" style="margin-bottom:14px"><button class="btn'+(su?' alt':'')+'" data-mode="login">Log in</button><button class="btn'+(su?'':' alt')+'" data-mode="signup">Sign up</button></div>'+(su?'<div class="f"><label for="an">Your name</label><input class="in" id="an" data-au="signup" autocomplete="name" value="'+esc(kn||"")+'"></div>':'')+'<div class="f"><label for="am">Mobile number</label><input class="in" id="am" inputmode="tel" data-au="'+mode+'" autocomplete="tel" placeholder="e.g. 7771234" value="'+esc(keep||"")+'"></div>'+((!su||Object.keys(US).length)?'<div class="f"><label for="ar">'+(su?'Record card number':'Record card number (staff only)')+'</label><input class="in" id="ar" data-au="'+mode+'" autocomplete="off" value="'+esc(kc||"")+'"></div>':'')+'<div class="f"><label for="ap">Password</label><input class="in" id="ap" type="password" data-au="'+mode+'" autocomplete="'+(su?'new-password':'current-password')+'"></div>'+(su?'<div class="f"><label for="ac">Confirm password</label><input class="in" id="ac" type="password" data-au="signup" autocomplete="new-password"></div>':'')+(err?'<div class="late" style="margin-bottom:10px" role="alert">'+esc(err)+'</div>':'')+'<button class="btn" data-go="'+mode+'" style="width:100%">'+(su?'Create account':'Log in')+'</button><p class="sub" style="margin:12px 0 0">The first account created on this device is the manager and sees every case. Other accounts are staff and only see cases assigned to their mobile number. Accounts and cases are stored only in this browser on this device. There is no SMS code or password reset yet, so keep your password safe.</p></div>'}
function enter(m){ME={mobile:m,name:US[m].name,role:US[m].role||(Object.keys(US)[0]===m?"manager":"staff")};KEY="caseload-v1-shared";try{localStorage.setItem("caseload-session",m)}catch(e){}load();notifyDue();S.v="list";S.id=null;S.q="";S.f="Active";S.s="All staff";draw()}
function submitAuth(mode){var su=mode==="signup",m=$("am").value.replace(/[^\d+]/g,""),pw=$("ap").value,nm=su?$("an").value.trim():"",card=$("ar")?$("ar").value.trim():"",dg=m.replace(/\D/g,"");function bad(t){authView(mode,t,m,nm,card)}
  if(su&&!nm)return bad("Enter your name.");if(dg.length<7||dg.length>15)return bad("Enter a valid mobile number.");
  if(!su){var u=US[m];if(!u)return bad("No account with this number. Tap Sign up to create one.");var rl=u.role||(Object.keys(US)[0]===m?"manager":"staff");if(rl==="staff"&&!findStf(m,card))return bad("Staff must enter the record card number registered by the manager.");hashPw(u.salt,pw).then(function(h){if(h!==u.hash)bad("Wrong password.");else enter(m)});return}
  if(US[m])return bad("This number already has an account. Tap Log in.");if(Object.keys(US).length&&!findStf(m,card))return bad("Your mobile number and record card number must be registered by the manager first.");if(pw.length<6)return bad("Password must be at least 6 characters.");if(pw!==$("ac").value)return bad("Passwords do not match.");
  var salt=String(Math.random()).slice(2)+Date.now();hashPw(salt,pw).then(function(h){if(!Object.keys(US).length){try{var lg=localStorage.getItem("caseload-v1");if(lg)localStorage.setItem("caseload-v1-"+m,lg)}catch(e){}}var rg=card&&findStf(m,card);if(rg&&!dgt(rg.mobile)){rg.mobile=m;saveStf()}US[m]={name:nm,salt:salt,hash:h,role:Object.keys(US).length?"staff":"manager"};try{localStorage.setItem("caseload-users",JSON.stringify(US))}catch(e){}enter(m)})}
$("app").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.dataset.au)submitAuth(e.target.dataset.au)});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ME){notifyDue();if(S.v==="list")draw()}});
var ss=null;try{ss=localStorage.getItem("caseload-session")}catch(e){}
if(ss&&US[ss])enter(ss);else authView(Object.keys(US).length?"login":"signup");
})();
